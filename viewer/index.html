      } else if (status === 'failed') {
        valSpan = el('span', {class:'ds-val'}, '\u2717');
        valSpan.style.color = 'var(--red)';
        valSpan.style.opacity = '0.7';
      } else if (status === 'invalidated') {
        valSpan = el('span', {class:'ds-val'}, '\u26a0');
        valSpan.style.color = 'var(--amber)';
        valSpan.style.opacity = '0.7';
      } else {
        valSpan = el('span', {class:'ds-val'}, '\u2014');
        valSpan.style.color = 'var(--muted)';
      }
      chip.appendChild(valSpan);
      chipWrap.appendChild(chip);
    }
    card.appendChild(chipWrap);

    card.addEventListener('click', () => { location.hash = '#model/' + encodeURIComponent(m.model_id); });
    grid.appendChild(card);
  }

  wrap.appendChild(grid);
}

/* ===================================================================
   VIEW: MODEL DETAIL (radar + gap + curves)
   =================================================================== */
async function viewModelDetail(app, modelId) {
  clearNode(app);
  const wrap = el('div', {class:'page-enter'});
  app.appendChild(wrap);
  wrap.appendChild(el('div', {class:'loading'}, 'Loading diagnosis...'));

  const [modelData, scoresData, diagData, allModels] = await Promise.all([
    api('/api/models/' + encodeURIComponent(modelId)),
    api('/api/models/' + encodeURIComponent(modelId) + '/scores'),
    api('/api/models/' + encodeURIComponent(modelId) + '/diagnosis'),
    api('/api/models'),
  ]);
  clearNode(wrap);

  modelColor(modelId);
  for (const m of allModels.models) modelColor(m.model_id);

  const model = modelData.model;

  // Back link
  wrap.appendChild(el('a', {class:'back-link', href:'#models'}, '\u2190 All Models'));

  // Header
  const hdr = el('div', {class:'detail-header'});
  const titleGrp = el('div', {class:'detail-title-group'});
  const titleRow = el('div', {class:'detail-title-row'});
  titleRow.appendChild(el('h1', null, model.display_name));
  titleRow.appendChild(makeBadge(model.model_type));
  const deleteBtn = el('button', {class:'btn btn-danger', style:'margin-left:auto'}, 'Delete Model');
  deleteBtn.addEventListener('click', () => showDeleteConfirm(modelId, model.display_name));
  titleRow.appendChild(deleteBtn);
  titleGrp.appendChild(titleRow);
  const stepText = diagData.latest_step ? ' \u00b7 Latest: step ' + diagData.latest_step : '';
  titleGrp.appendChild(el('div', {class:'detail-meta'},
    'Owner: ' + model.owner + ' \u00b7 ' + modelData.checkpoints.length + ' checkpoints' + stepText));
  hdr.appendChild(titleGrp);
  if (diagData.latest_checkpoint) {
    const latestCp = modelData.checkpoints.find(c => c.checkpoint_id === diagData.latest_checkpoint);
    if (latestCp && latestCp.checkpoint_path) {
      const pathEl = el('div', {style: 'font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:4px;cursor:pointer;', title: 'Click to copy'}, latestCp.checkpoint_path);
      pathEl.addEventListener('click', () => {
        navigator.clipboard.writeText(latestCp.checkpoint_path);
        pathEl.style.color = 'var(--green)';
        setTimeout(() => pathEl.style.color = 'var(--muted)', 1000);
      });
      hdr.appendChild(pathEl);
    }
  }
  wrap.appendChild(hdr);

  // Checkpoint info strip
  const ckptStrip = el('div', {class:'ckpt-strip'});
  if (diagData.latest_step) {
    const latestItem = el('span', {class:'ckpt-item'});
    latestItem.appendChild(document.createTextNode('Latest: step '));
    latestItem.appendChild(el('span', {class:'ckpt-val'}, String(diagData.latest_step)));
    ckptStrip.appendChild(latestItem);
  }
  if (diagData.best_overall_step) {
    ckptStrip.appendChild(el('span', {class:'ckpt-sep'}, '|'));
    const bestItem = el('span', {class:'ckpt-item'});
    bestItem.appendChild(document.createTextNode('Best overall: step '));
    bestItem.appendChild(el('span', {class:'ckpt-val'}, String(diagData.best_overall_step)));
    ckptStrip.appendChild(bestItem);
  }
  if (diagData.best_per_dataset && Object.keys(diagData.best_per_dataset).length > 0) {
    // Show the dataset with the biggest gap (most negative first in sortedDs later, but pick from best_per_dataset)
    const bpd = diagData.best_per_dataset;
    const dsEntries = Object.entries(diagData.scores || {}).sort((a, b) => (a[1].gap || 0) - (b[1].gap || 0));
    const worstDs = dsEntries.length > 0 ? dsEntries[0][0] : Object.keys(bpd).sort()[0];
    if (worstDs && bpd[worstDs]) {
      ckptStrip.appendChild(el('span', {class:'ckpt-sep'}, '|'));
      const dsItem = el('span', {class:'ckpt-item'});
      dsItem.appendChild(document.createTextNode('Best on ' + worstDs + ': step '));
      dsItem.appendChild(el('span', {class:'ckpt-val'}, String(bpd[worstDs])));
      ckptStrip.appendChild(dsItem);
    }
  }
  if (ckptStrip.children.length > 0) wrap.appendChild(ckptStrip);

  // Phase 5: Promotion status + checkpoint diff
  const promotionWrap = el('div', {style:'display:flex; gap:12px; margin-bottom:16px; align-items:flex-start; flex-wrap:wrap;'});
  const promotionBox = el('div', {style:'flex:1; min-width:200px;'});
  renderPromotionBadge(promotionBox, modelId);
  promotionWrap.appendChild(promotionBox);
  // Diff picker: compare two checkpoints
  if (modelData.checkpoints.length >= 2) {
    const diffBox = el('div', {style:'display:flex; gap:6px; align-items:center; font-size:12px;'});
    diffBox.appendChild(el('span', {style:'color:var(--muted);'}, 'Diff:'));
    const selA = el('select', {style:'background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:4px 8px;font-size:11px;font-family:var(--font-body);'});
    const selB = el('select', {style:'background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:4px 8px;font-size:11px;font-family:var(--font-body);'});
    for (const cp of modelData.checkpoints) {
      const label = cp.training_step != null ? 'Step ' + cp.training_step : cp.checkpoint_id;
      selA.appendChild(el('option', {value: cp.checkpoint_id}, label));
      selB.appendChild(el('option', {value: cp.checkpoint_id}, label));
    }
    if (modelData.checkpoints.length >= 2) selB.selectedIndex = modelData.checkpoints.length - 1;
    const diffBtn = el('button', {class:'btn', style:'font-size:11px;padding:4px 10px;'}, 'Compare');
    diffBtn.addEventListener('click', () => {
      location.hash = '#diff/' + encodeURIComponent(selA.value) + '/' + encodeURIComponent(selB.value);
    });
    diffBox.appendChild(selA);
    diffBox.appendChild(el('span', {style:'color:var(--muted);'}, 'vs'));
    diffBox.appendChild(selB);
    diffBox.appendChild(diffBtn);
    promotionWrap.appendChild(diffBox);
  }
  wrap.appendChild(promotionWrap);

  // Diagnostic panels: fixed-baseline difference + gap table
  const diagGrid = el('div', {class:'diag-grid'});
  const baselineModels = allModels.models.filter(m => m.model_type === 'baseline');
  const defaultBaseline = baselineModels.find(m => m.model_id === DEFAULT_BASELINE_ID) || baselineModels[0];
  const sourceScoreRows = Object.entries(diagData.scores || {}).sort((a, b) => a[0].localeCompare(b[0]));

  // -- Difference Bar Chart --
  const deltaPanel = el('div', {class:'panel'});
  const deltaHead = el('div', {class:'panel-head'});
  const deltaPanelTitle = el('div', {class:'panel-title'}, 'Difference vs Baseline');
  const deltaActions = el('div', {class:'chart-actions'});
  const deltaDownloadBtn = el('button', {class:'chart-download-btn', type:'button'}, 'PNG');
  deltaActions.appendChild(deltaDownloadBtn);
  deltaHead.appendChild(deltaPanelTitle);
  deltaHead.appendChild(deltaActions);
  deltaPanel.appendChild(deltaHead);
  deltaPanel.appendChild(el('div', {class:'info-note'}, 'Difference is current model score minus the selected fixed baseline on the same benchmark.'));

  const refSelectWrap = el('div', {style:'margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;'});
  refSelectWrap.appendChild(el('label', {style:'font-size:12px;color:var(--muted);'}, 'Baseline'));
  const refSelect = document.createElement('select');
  refSelect.style.fontSize = '12px';
  for (const m of baselineModels) {
    const opt = document.createElement('option');
    opt.value = m.model_id;
    opt.textContent = m.display_name;
    refSelect.appendChild(opt);
  }
  if (defaultBaseline) refSelect.value = defaultBaseline.model_id;
  refSelectWrap.appendChild(refSelect);
  refSelectWrap.appendChild(addInfoIcon('Baseline is fixed across all benchmarks. Missing baseline results stay missing instead of switching to another model.'));
  deltaPanel.appendChild(refSelectWrap);
  deltaPanel.appendChild(makeDeltaLegend());

  const deltaWrap = el('div', {class:'delta-bar-wrap'});
  const deltaCanvas = document.createElement('canvas');
  deltaWrap.appendChild(deltaCanvas);
  deltaPanel.appendChild(deltaWrap);
  diagGrid.appendChild(deltaPanel);

  let deltaChart = null;
  bindDownloadButton(deltaDownloadBtn, () => deltaChart, () => deltaPanelTitle.textContent);

  // -- Gap Analysis Table --
  const gapPanel = el('div', {class:'panel'});
  const gapHead = el('div', {class:'panel-head'});
  const gapPanelTitle = el('div', {class:'panel-title'}, 'Difference Table');
  gapHead.appendChild(gapPanelTitle);
  gapPanel.appendChild(gapHead);
  gapPanel.appendChild(el('div', {class:'info-note'}, 'Green means this model is above the selected baseline; red means it is below it.'));
  const gapTable = document.createElement('table');
  gapTable.className = 'gap-table';

  const gHead = document.createElement('thead');
  const gHRow = document.createElement('tr');
  ['Benchmark', 'Score', 'Baseline', 'Difference', 'Trend', 'Sig.'].forEach(c => gHRow.appendChild(el('th', null, c)));
  gHead.appendChild(gHRow);
  gapTable.appendChild(gHead);
  const gBody = document.createElement('tbody');
  gapTable.appendChild(gBody);
  gapPanel.appendChild(gapTable);
  diagGrid.appendChild(gapPanel);
  wrap.appendChild(diagGrid);

  function sortedGapEntries(gapData) {
    return Object.entries(gapData).sort((a, b) => {
      const av = a[1].gap == null ? Infinity : a[1].gap;
      const bv = b[1].gap == null ? Infinity : b[1].gap;
      return av - bv;
    });
  }

  function buildGapData(refScoreMap, refName) {
    const out = {};
    for (const [ds, info] of sourceScoreRows) {
      const ref = refScoreMap[ds];
      const refVal = ref ? ref.metric_value : null;
      const gap = refVal != null && info.value != null ? info.value - refVal : null;
      out[ds] = {
        ...info,
        baseline_best: refVal,
        baseline_model: refName,
        gap,
        significance: ref
          ? computeSignificanceFromCi(info.value, info.ci_lower, info.ci_upper, ref.metric_value, ref.ci_lower, ref.ci_upper)
          : 'insufficient_data',
      };
    }
    return out;
  }

  function renderGapTable(gapData) {
    clearNode(gBody);
    for (const [ds, info] of sortedGapEntries(gapData)) {
      const tr = document.createElement('tr');

      const dsTd = el('td', {style:'font-weight:500;color:var(--text-bright)'});
      dsTd.appendChild(document.createTextNode(ds));
      if (info.metric_name) {
        dsTd.appendChild(document.createTextNode(' '));
        dsTd.appendChild(el('span', {style:'font-weight:400;color:var(--muted);font-size:11px'}, info.metric_name));
      }
      tr.appendChild(dsTd);

      const valTd = el('td', {class:'gap-value'});
      valTd.textContent = info.value.toFixed(4);
      valTd.style.color = scoreColor(info.value);
      valTd.dataset.scoreText = info.value;   // for in-place recolor on theme toggle
      if (info.sample_count != null) {
        valTd.appendChild(document.createTextNode(' '));
        valTd.appendChild(el('span', {style:'font-weight:400;color:var(--muted);font-size:10px'}, 'n=' + info.sample_count));
      }
      tr.appendChild(valTd);

      const blTd = document.createElement('td');
      if (info.baseline_best != null) {
        blTd.appendChild(el('span', {class:'gap-value', style:'color:var(--muted)'}, info.baseline_best.toFixed(4)));
        blTd.appendChild(document.createTextNode(' '));
        blTd.appendChild(el('span', {style:'font-size:11px;color:var(--muted)'}, info.baseline_model || ''));
      } else {
        blTd.textContent = '\u2014';
      }
      tr.appendChild(blTd);

      const gapTd = el('td', {class:'gap-value ' + gapClass(info.gap)});
      gapTd.textContent = info.gap != null ? (info.gap > 0 ? '+' : '') + info.gap.toFixed(4) : '\u2014';
      tr.appendChild(gapTd);

      const trendTd = el('td', {class:'trend-icon trend-' + info.trend});
      trendTd.textContent = trendIcon(info.trend);
      tr.appendChild(trendTd);

      const sigTd = el('td', {style: 'text-align:center'});
      const sig = info.significance || 'insufficient_data';
      const sigMap = {
        likely_real: {icon: '\u25cf', class: info.gap >= 0 ? 'gap-positive' : 'gap-negative', tip: 'CIs do not overlap \u2014 likely real'},
        likely_noise: {icon: '~', class: 'gap-neutral', tip: 'CIs overlap significantly \u2014 likely noise'},
        uncertain: {icon: '?', class: 'trend-flat', tip: 'Partial CI overlap \u2014 uncertain'},
        insufficient_data: {icon: '\u2014', class: 'gap-neutral', tip: 'Insufficient data for CI comparison'},
      };
      const s = sigMap[sig] || sigMap.insufficient_data;
      sigTd.textContent = s.icon;
      sigTd.className = s.class;
      sigTd.title = s.tip;
      sigTd.style.cursor = 'help';
      tr.appendChild(sigTd);

      gBody.appendChild(tr);
    }
  }

  function buildDeltaChartFromGapData(gapData, refName) {
    const gaps = sortedGapEntries(gapData)
      .map(([ds, info]) => ({ ds, gap: info.gap, significance: info.significance }))
      .filter(g => g.gap != null);

    if (deltaChart) { deltaChart.destroy(); _charts = _charts.filter(c => c !== deltaChart); }
    deltaPanelTitle.textContent = 'Difference vs ' + refName;
    gapPanelTitle.textContent = 'Difference vs ' + refName;

    const cc = chartColors();
    const barColors = gaps.map(g => {
      const sig = g.significance || 'insufficient_data';
      const alpha = sig === 'likely_noise' ? '66' : sig === 'insufficient_data' ? '99' : 'ff';
      return ((g.gap || 0) >= 0 ? cc.green : cc.red) + alpha;
    });

    deltaChart = new Chart(deltaCanvas, {
      type: 'bar',
      data: {
        labels: gaps.map(g => g.ds),
        datasets: [{
          label: 'Difference',
          data: gaps.map(g => g.gap),
          backgroundColor: barColors,
          borderColor: gaps.map(g => g.gap >= 0 ? cc.green : cc.red),
          borderWidth: 1,
          borderRadius: 3,
        }],
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            grid: { color: cc.grid },
            ticks: { color: cc.tick, font: { size: 11, family: 'JetBrains Mono' } },
          },
          y: {
            grid: { display: false },
            ticks: { color: cc.tick, font: { size: 11, family: 'Outfit' } },
          },
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: cc.tooltipBg, borderColor: cc.tooltipBorder, borderWidth: 1,
            titleColor: cc.tooltipTitle, bodyColor: cc.tooltipBody,
            callbacks: { label(ctx) { const v = ctx.raw; return 'model - baseline: ' + (v > 0 ? '+' : '') + v.toFixed(4); } },
          },
        },
      },
    });
    _charts.push(deltaChart);
    deltaChart.$gaps = gaps;
  }

  async function renderSelectedBaseline(refId) {
    const refModel = baselineModels.find(m => m.model_id === refId);
    if (!refModel) {
      renderGapTable({});
      return;
    }
    const refData = await api('/api/models/' + encodeURIComponent(refId) + '/scores');
    const gapData = buildGapData(primaryScoreMap(refData.scores), refModel.display_name);
    renderGapTable(gapData);
    buildDeltaChartFromGapData(gapData, refModel.display_name);
  }

  refSelect.addEventListener('change', async () => {
    try { await renderSelectedBaseline(refSelect.value); }
    catch (e) { console.error('Failed to fetch baseline scores:', e); }
  });

  if (defaultBaseline) await renderSelectedBaseline(defaultBaseline.model_id);
  else renderGapTable({});

  // Compare controls
  const compareBar = el('div', {class:'compare-bar'});
  compareBar.appendChild(el('label', null, 'Compare with...'));
  const compareSelect = document.createElement('select');
  compareSelect.multiple = true;
  compareSelect.size = Math.min(5, Math.max(2, allModels.models.length - 1));
  compareSelect.style.minWidth = '220px';
  for (const m of allModels.models) {
    if (m.model_id === modelId) continue;
    const opt = document.createElement('option');
    opt.value = m.model_id;
    opt.textContent = m.display_name + ' (' + m.model_type + ')';
    compareSelect.appendChild(opt);
  }
  compareBar.appendChild(compareSelect);
  const commonToggle = document.createElement('input');
  commonToggle.type = 'checkbox';
  commonToggle.id = 'common-only';
  const commonLabel = el('label', {
    for: 'common-only',
    style: 'color:var(--muted);font-size:12px;cursor:pointer',
    title: 'Only draw benchmarks where every selected model has completed results.',
  }, 'Shared benchmarks only');
  compareBar.appendChild(commonToggle);
  compareBar.appendChild(commonLabel);
  compareBar.appendChild(addInfoIcon('Shared benchmarks only avoids comparing across missing benchmark coverage. It is mainly useful for strict model-to-model comparisons.'));
  const updateBtn = el('button', {class:'btn'}, 'Update Charts');
  compareBar.appendChild(updateBtn);
  const fullCompareBtn = el('button', {class:'btn btn-secondary'}, 'Open full comparison');
  compareBar.appendChild(fullCompareBtn);
  wrap.appendChild(compareBar);

  // Section head for training curves
  const curvesHead = el('div', {class:'section-head', style:'display:flex;align-items:center;justify-content:space-between'});
  curvesHead.appendChild(document.createTextNode('Training Curves'));
  const bandControls = el('span', {style:'display:flex;align-items:center'});
  const resetZoomBtn = el('button', {class:'zoom-reset-btn', type:'button'}, 'Reset zoom');
  const bandToggle = document.createElement('input');
  bandToggle.type = 'checkbox';
  bandToggle.id = 'show-bands';
  const bandLabel = el('label', {for: 'show-bands', style: 'color:var(--muted);font-size:12px;cursor:pointer;margin-left:16px'}, 'Show uncertainty');
  bandControls.appendChild(resetZoomBtn);
  bandControls.appendChild(bandToggle);
  bandControls.appendChild(bandLabel);
  curvesHead.appendChild(bandControls);
  wrap.appendChild(curvesHead);
  wrap.appendChild(el('div', {class:'zoom-hint'}, 'Steps are most meaningful within the same training run. Drag any rectangle to zoom, use the wheel to zoom, shift-drag to pan, double click or Reset zoom to restore.'));

  // Chart grid
  const chartGrid = el('div', {class:'chart-grid'});
  wrap.appendChild(chartGrid);

  // Build dataset map
  const primaryScores = scoresData.scores.filter(s => s.is_primary);
  const dsMap = new Map();
  for (const s of primaryScores) {
    if (!dsMap.has(s.dataset_name)) dsMap.set(s.dataset_name, []);
    dsMap.get(s.dataset_name).push(s);
  }
  for (const pts of dsMap.values()) pts.sort((a,b) => (a.training_step ?? Infinity) - (b.training_step ?? Infinity));
  const datasets = [...dsMap.keys()].sort();

  // x-range for baselines
  let allSteps = [];
  for (const pts of dsMap.values()) for (const p of pts) if (p.training_step != null) allSteps.push(p.training_step);
  const xMin = allSteps.length ? Math.min(...allSteps) : 0;
  const xMax = allSteps.length ? Math.max(...allSteps) : 1;

  async function renderCurves(compareIds) {
    // Destroy only line charts, keep delta bar chart
    const keep = deltaChart ? [deltaChart] : [];
    _charts.filter(c => !keep.includes(c)).forEach(c => { try { c.destroy(); } catch(_){} });
    _charts = [...keep];
    clearNode(chartGrid);
    const cc = chartColors();

    const useCommonOnly = commonToggle.checked;
    const showBands = bandToggle.checked;

    let compareByDs = {};
    let commonDatasets = null;
    if (compareIds.length > 0) {
      const allIds = [modelId, ...compareIds].join(',');
      const commonParam = useCommonOnly ? '&common_only=true' : '';
      const results = await Promise.allSettled(
        datasets.map(ds => api('/api/compare?models=' + encodeURIComponent(allIds) + '&dataset=' + encodeURIComponent(ds) + commonParam))
      );
      datasets.forEach((ds, i) => { if (results[i].status === 'fulfilled') compareByDs[ds] = results[i].value; });

      // If common_only, filter to datasets present in compareByDs that have data for all models
      if (useCommonOnly) {
        commonDatasets = new Set();
        for (const [ds, cData] of Object.entries(compareByDs)) {
          if (cData.models && cData.models.length === compareIds.length + 1) {
            commonDatasets.add(ds);
          }
        }
      }
    }

    const renderDs = commonDatasets ? datasets.filter(ds => commonDatasets.has(ds)) : datasets;

    for (const dsName of renderDs) {
      const pts = dsMap.get(dsName) || [];
      const card = el('div', {class:'chart-card'});
      const metricName = (dsMap.get(dsName) || [])[0]?.metric_name || '';
      const titleEl = el('h3', null, dsName);
      if (metricName) {
        titleEl.appendChild(document.createTextNode(' '));
        titleEl.appendChild(el('span', {style:'font-weight:400;color:var(--muted);font-size:11px'}, metricName));
      }
      const cardHead = el('div', {class:'chart-card-head'});
      const cardActions = el('div', {class:'chart-actions'});
      const chartDownloadBtn = el('button', {class:'chart-download-btn', type:'button'}, 'PNG');
      cardActions.appendChild(chartDownloadBtn);
      cardHead.appendChild(titleEl);
      cardHead.appendChild(cardActions);
      card.appendChild(cardHead);
      const cw = el('div', {class:'chart-wrap'});
      const canvas = document.createElement('canvas');
      cw.appendChild(canvas);
      card.appendChild(cw);
      chartGrid.appendChild(card);

      const chartDatasets = [];

      if (compareIds.length > 0 && compareByDs[dsName]) {
        for (const mEntry of compareByDs[dsName].models) {
          const color = modelColor(mEntry.model_id);
          if (mEntry.model_type === 'baseline' && mEntry.data_points.length > 0) {
            const val = mEntry.data_points[0].metric_value;
            chartDatasets.push({
              label: mEntry.display_name, data: [{x:xMin,y:val},{x:xMax,y:val}],
              borderColor: color, backgroundColor: color+'22', borderDash:[6,4], borderWidth:1.5,
              pointRadius:0, pointHoverRadius:3, tension:0,
            });
          } else {
            chartDatasets.push({
              label: mEntry.display_name,
              data: mEntry.data_points.map(p => ({x:p.training_step, y:p.metric_value})),
              borderColor: color, backgroundColor: color+'22', borderWidth:2,
              pointRadius:2.5, pointHoverRadius:5, tension:0.3,
            });
            // Error bands for training models
            if (showBands && mEntry.data_points.some(p => p.ci_lower != null && p.ci_upper != null)) {
              chartDatasets.push({
                label: mEntry.display_name + ' CI upper',
                data: mEntry.data_points.filter(p => p.ci_upper != null).map(p => ({x: p.training_step, y: p.ci_upper})),
                borderColor: 'transparent',
                backgroundColor: color + '1a',
                pointRadius: 0,
                fill: '+1',
                borderWidth: 0,
                hidden: false,
                _isCIBand: true,
              });
              chartDatasets.push({
                label: mEntry.display_name + ' CI lower',
                data: mEntry.data_points.filter(p => p.ci_lower != null).map(p => ({x: p.training_step, y: p.ci_lower})),
                borderColor: 'transparent',
                backgroundColor: 'transparent',
                pointRadius: 0,
                borderWidth: 0,
                hidden: false,
                _isCIBand: true,
              });
            }
          }
        }
      } else {
        const color = modelColor(modelId);
        chartDatasets.push({
          label: model.display_name,
          data: pts.map(p => ({x:p.training_step, y:p.metric_value})),
          borderColor: color, backgroundColor: color+'22', borderWidth:2,
          pointRadius:2.5, pointHoverRadius:5, tension:0.3,
        });
        // Error bands for single model view
        if (showBands && pts.some(p => p.ci_lower != null && p.ci_upper != null)) {
          chartDatasets.push({
            label: model.display_name + ' CI upper',
            data: pts.filter(p => p.ci_upper != null).map(p => ({x: p.training_step, y: p.ci_upper})),
            borderColor: 'transparent',
            backgroundColor: color + '1a',
            pointRadius: 0,
            fill: '+1',
            borderWidth: 0,
            hidden: false,
            _isCIBand: true,
          });
          chartDatasets.push({
            label: model.display_name + ' CI lower',
            data: pts.filter(p => p.ci_lower != null).map(p => ({x: p.training_step, y: p.ci_lower})),
            borderColor: 'transparent',
            backgroundColor: 'transparent',
            pointRadius: 0,
            borderWidth: 0,
            hidden: false,
            _isCIBand: true,
          });
        }
      }

      // Auto-scale y-axis
      let yVals = chartDatasets.flatMap(d => d.data.map(p => p.y));
      let yMin = Math.max(0, Math.floor((Math.min(...yVals) - 0.05) * 10) / 10);
      let yMax = Math.min(1, Math.ceil((Math.max(...yVals) + 0.05) * 10) / 10);

      const chart = new Chart(canvas, {
        type: 'line',
        data: { datasets: chartDatasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          animation: { duration: 300 },
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { type:'linear', ticks:{color:cc.tick, maxTicksLimit:6, font:{size:11}}, grid:{color:cc.grid} },
            y: { min:yMin, max:yMax, ticks:{color:cc.tick, maxTicksLimit:5, font:{size:11,family:'JetBrains Mono'}}, grid:{color:cc.grid} },
          },
          plugins: {
            legend: {
              labels:{
                color:cc.legend, boxWidth:12, font:{size:11},
                filter: function(item, chartData) {
                  return !chartData.datasets[item.datasetIndex]._isCIBand;
                },
              },
            },
            tooltip: {
              backgroundColor:cc.tooltipBg, borderColor:cc.tooltipBorder, borderWidth:1, titleColor:cc.tooltipTitle, bodyColor:cc.tooltipBody,
              callbacks: { label(ctx) { if (ctx.dataset._isCIBand) return null; const r=ctx.raw; return ctx.dataset.label+': '+r.y.toFixed(4)+(r.x!=null?' (step '+r.x+')':''); } },
              filter: function(tooltipItem) { return !tooltipItem.dataset._isCIBand; },
            },
            zoom: zoomPluginOptions(),
          },
        },
      });
      _charts.push(chart);
      canvas.addEventListener('dblclick', () => resetChartZoom(chart));
      bindDownloadButton(chartDownloadBtn, () => chart, () => model.display_name + '-' + dsName + '-curve');
    }
  }

  resetZoomBtn.addEventListener('click', () => {
    _charts.forEach(ch => { if (ch !== deltaChart) resetChartZoom(ch); });
  });

  await renderCurves([]);

  function getSelectedCompareIds() {
    return Array.from(compareSelect.selectedOptions).map(o => o.value);
  }

  updateBtn.addEventListener('click', async () => {
    await renderCurves(getSelectedCompareIds());
  });

  fullCompareBtn.addEventListener('click', () => {
    const ids = [modelId, ...getSelectedCompareIds()].slice(0, MAX_COMPARE_MODELS);
    location.hash = buildCompareHash({
      models: ids,
      baseline: modelId,
      suite: '',
      commonOnly: false,
      benchmark: '',
      mode: 'bars',
    });
  });

  bandToggle.addEventListener('change', async () => {
    await renderCurves(getSelectedCompareIds());
  });
}

/* ===================================================================
   VIEW: COMPARE MODELS
   =================================================================== */
async function viewCompare(app) {
  clearNode(app);
  const wrap = el('div', {class:'page-enter'});
  app.appendChild(wrap);
  wrap.appendChild(el('div', {class:'loading'}, 'Loading comparison...'));

  const params = parseHashQuery();
  const state = {
    models: [],
    baseline: params.get('baseline') || '',
    suite: params.get('suite') || '',
    commonOnly: params.get('common_only') === 'true',
    benchmark: params.get('benchmark') || '',
    mode: ['delta', 'radar', 'curves'].includes(params.get('mode')) ? params.get('mode') : 'bars',
    scale: params.get('scale') === 'raw' ? 'raw' : 'normalized',
  };

  async function loadHeatmap(suiteId) {
    if (!suiteId) return api('/api/heatmap');
    try {
      return await api('/api/heatmap?suite_id=' + encodeURIComponent(suiteId));
    } catch (e) {
      state.suite = '';
      return api('/api/heatmap');
    }
  }

  let [data, suitesData] = await Promise.all([loadHeatmap(state.suite), api('/api/suites')]);
  let summaryData = null;
  let byId = modelById(data);
  const requestedModels = (params.get('models') || '')
    .split(',')
    .map(s => s.trim())
    .filter(Boolean);
  const unique = [];
  for (const id of requestedModels) {
    if (byId.has(id) && !unique.includes(id)) unique.push(id);
  }
  state.models = unique.slice(0, MAX_COMPARE_MODELS);
  if (!state.models.length) state.models = topModelsByAverage(data, 3);
  if (!state.models.includes(state.baseline)) state.baseline = state.models[0] || '';

  clearNode(wrap);

  const title = el('div', {class:'detail-header'});
  const titleGroup = el('div', {class:'detail-title-group'});
  const titleRow = el('div', {class:'detail-title-row'});
  titleRow.appendChild(el('h1', null, 'Compare Models'));
  titleGroup.appendChild(titleRow);
  titleGroup.appendChild(el('div', {class:'detail-meta'}, 'Primary scores across selected benchmarks'));
  title.appendChild(titleGroup);
  wrap.appendChild(title);

  const shell = el('div', {class:'compare-shell'});
  wrap.appendChild(shell);

  const toolbar = el('div', {class:'compare-toolbar'});
  shell.appendChild(toolbar);

  const controlsRow = el('div', {class:'compare-toolbar-row'});
  toolbar.appendChild(controlsRow);

  const addSelect = document.createElement('select');
  addSelect.style.minWidth = '240px';
  controlsRow.appendChild(addSelect);

  controlsRow.appendChild(el('label', null, 'Baseline'));
  const baselineSelect = document.createElement('select');
  baselineSelect.style.minWidth = '180px';
  controlsRow.appendChild(baselineSelect);

  controlsRow.appendChild(el('label', null, 'Suite'));
  const suiteSelect = document.createElement('select');
  const allSuitesOpt = el('option', {value:''}, 'All Benchmarks');
  suiteSelect.appendChild(allSuitesOpt);
  for (const s of suitesData.suites || []) {
    suiteSelect.appendChild(el('option', {value:s.suite_id}, s.display_name + ' (' + s.dataset_names.length + ')'));
  }
  suiteSelect.value = state.suite;
  controlsRow.appendChild(suiteSelect);

  controlsRow.appendChild(el('label', null, 'Benchmark'));
  const benchmarkSelect = document.createElement('select');
  benchmarkSelect.style.minWidth = '200px';
  controlsRow.appendChild(benchmarkSelect);

  const commonLabel = el('label', {style:'display:inline-flex;align-items:center;gap:6px;cursor:pointer;'});
  const commonToggle = document.createElement('input');
  commonToggle.type = 'checkbox';
  commonToggle.checked = state.commonOnly;
  commonLabel.appendChild(commonToggle);
  commonLabel.appendChild(document.createTextNode('Shared benchmarks only'));
  controlsRow.appendChild(commonLabel);
  controlsRow.appendChild(addInfoIcon('Only show benchmarks where every selected model has a completed result. This avoids coverage-driven comparisons.'));
  const sharedCount = el('span', {class:'shared-count'}, '');
  controlsRow.appendChild(sharedCount);

  controlsRow.appendChild(el('label', null, 'Scale'));
  const scaleToggle = el('div', {class:'segmented'});
  const normalizedBtn = el('button', {type:'button'}, 'Normalized');
  const rawBtn = el('button', {type:'button'}, 'Raw');
  scaleToggle.appendChild(normalizedBtn);
  scaleToggle.appendChild(rawBtn);
  controlsRow.appendChild(scaleToggle);

  controlsRow.appendChild(el('label', null, 'Preset'));
  const presetSelect = document.createElement('select');
  presetSelect.style.minWidth = '170px';
  controlsRow.appendChild(presetSelect);
  const savePresetBtn = el('button', {class:'btn btn-secondary btn-small', type:'button'}, 'Save preset');
  controlsRow.appendChild(savePresetBtn);
  const reportDownloadBtn = el('button', {class:'chart-download-btn', type:'button'}, 'Report PNG');
  controlsRow.appendChild(reportDownloadBtn);

  const selectedRow = el('div', {class:'compare-toolbar-row'});
  const selectedWrap = el('div', {class:'compare-selected'});
  selectedRow.appendChild(selectedWrap);
  toolbar.appendChild(selectedRow);

  const summary = el('div', {class:'compare-summary'});
  shell.appendChild(summary);

  const reportExportArea = el('div', {class:'compare-report-export-area'});
  shell.appendChild(reportExportArea);

  const chartPanel = el('div', {class:'compare-chart-panel'});
  reportExportArea.appendChild(chartPanel);
  const chartHead = el('div', {class:'compare-chart-head'});
  const chartTitleWrap = el('div');
  const chartTitle = el('div', {class:'section-head', style:'margin:0;border:0;padding:0;'}, 'Benchmark Scores');
  const chartNote = el('div', {class:'compare-note'}, '');
  chartTitleWrap.appendChild(chartTitle);
  chartTitleWrap.appendChild(chartNote);
  chartHead.appendChild(chartTitleWrap);
  const chartTools = el('div', {class:'compare-chart-tools'});
  const modeTabs = el('div', {class:'compare-mode-tabs'});
  const barsBtn = el('button', {class:'compare-mode-btn', type:'button'}, 'Grouped bars');
  const deltaBtn = el('button', {class:'compare-mode-btn', type:'button'}, 'Delta bars');
  const radarBtn = el('button', {class:'compare-mode-btn', type:'button'}, 'Radar');
  const curvesBtn = el('button', {class:'compare-mode-btn', type:'button'}, 'Curves');
  modeTabs.appendChild(barsBtn);
  modeTabs.appendChild(deltaBtn);
  modeTabs.appendChild(radarBtn);
  modeTabs.appendChild(curvesBtn);
  const compareDownloadBtn = el('button', {class:'chart-download-btn', type:'button'}, 'PNG');
  const compareResetZoomBtn = el('button', {class:'zoom-reset-btn', type:'button'}, 'Reset zoom');
  chartTools.appendChild(modeTabs);
  chartTools.appendChild(compareResetZoomBtn);
  chartTools.appendChild(compareDownloadBtn);
  chartHead.appendChild(chartTools);
  chartPanel.appendChild(chartHead);
  const chartMount = el('div', {class:'compare-big-chart'});
  chartPanel.appendChild(chartMount);

  const tablePanel = el('div', {class:'compare-table-panel'});
  reportExportArea.appendChild(tablePanel);

  let compareChart = null;
  const PRESET_KEY = 'eval360-compare-presets';
  bindDownloadButton(compareDownloadBtn, () => compareChart, () => 'compare-' + state.mode + '-' + state.scale);
  reportDownloadBtn.addEventListener('click', () => {
    downloadReportPng(reportExportArea, 'compare-report-' + state.mode + '-' + state.scale, reportDownloadBtn);
  });

  function compareModeHasZoom() {
    return state.mode === 'curves' || state.mode === 'radar';
  }

  function loadPresets() {
    try {
      const raw = localStorage.getItem(PRESET_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function savePresets(presets) {
    try { localStorage.setItem(PRESET_KEY, JSON.stringify(presets.slice(0, 20))); } catch (e) {}
  }

  function populatePresetSelect() {
    const presets = loadPresets();
    clearNode(presetSelect);
    presetSelect.appendChild(el('option', {value:''}, presets.length ? 'Load preset...' : 'No presets'));
    presets.forEach((p, idx) => {
      presetSelect.appendChild(el('option', {value:String(idx)}, p.name || ('Preset ' + (idx + 1))));
    });
  }

  function destroyCompareChart() {
    if (!compareChart) return;
    _charts = _charts.filter(c => c !== compareChart);
    try { compareChart.destroy(); } catch (e) {}
    compareChart = null;
  }

  async function loadSummary() {
    if (!state.models.length) {
      summaryData = {models: [], datasets: [], baseline_model_id: '', matrix: {}, coverage: {}, categories: {}};
      return summaryData;
    }
    const p = new URLSearchParams();
    p.set('models', state.models.join(','));
    if (state.baseline) p.set('baseline', state.baseline);
    if (state.suite) p.set('suite_id', state.suite);
    if (state.commonOnly) p.set('common_only', 'true');
    if (state.benchmark) p.set('benchmark', state.benchmark);
    summaryData = await api('/api/compare/summary?' + p.toString());
    return summaryData;
  }

  function currentDatasets() {
    return summaryData ? (summaryData.datasets || []) : [];
  }

  function tableModelOrder() {
    if (!state.baseline) return [...state.models];
    return [state.baseline, ...state.models.filter(mid => mid !== state.baseline)];
  }

  async function updateUrlAndRender() {
    if (!state.models.includes(state.baseline)) state.baseline = state.models[0] || '';
    setCompareUrl(state);
    await renderAll();
  }

  function populateAddSelect() {
    clearNode(addSelect);
    const placeholder = el('option', {value:''}, state.models.length >= MAX_COMPARE_MODELS ? 'Compare list full' : 'Add model...');
    addSelect.appendChild(placeholder);
    for (const m of data.models || []) {
      if (state.models.includes(m.model_id)) continue;
      const opt = el('option', {value:m.model_id}, m.display_name + ' (' + m.model_type + ')');
      addSelect.appendChild(opt);
    }
    addSelect.value = '';
    addSelect.disabled = state.models.length >= MAX_COMPARE_MODELS;
  }

  function populateBaselineSelect() {
    clearNode(baselineSelect);
    for (const id of state.models) {
      const m = byId.get(id);
      if (!m) continue;
      baselineSelect.appendChild(el('option', {value:id}, m.display_name));
    }
    baselineSelect.value = state.baseline;
    baselineSelect.disabled = state.models.length === 0;
  }

  function populateBenchmarkSelect() {
    const prev = state.benchmark;
    clearNode(benchmarkSelect);
    benchmarkSelect.appendChild(el('option', {value:''}, 'All Benchmarks'));
    for (const ds of orderedDatasetsFromHeatmap(data)) {
      benchmarkSelect.appendChild(el('option', {value:ds}, ds));
    }
    if (prev && orderedDatasetsFromHeatmap(data).includes(prev)) {
      state.benchmark = prev;
    } else {
      state.benchmark = '';
    }
    benchmarkSelect.value = state.benchmark;
  }

  function renderSelectedChips() {
    clearNode(selectedWrap);
    if (!state.models.length) {
      selectedWrap.appendChild(el('span', {style:'color:var(--muted);font-size:13px;'}, 'No models selected'));
      return;
    }
    for (const id of state.models) {
      const m = byId.get(id);
      if (!m) continue;
      const chip = el('span', {class:'compare-chip'});
      chip.appendChild(el('span', {class:'compare-chip-swatch', style:'background:' + modelColor(id)}));
      chip.appendChild(el('span', {class:'compare-chip-name'}, m.display_name));
      if (id === state.baseline) {
        chip.appendChild(el('span', {class:'badge', style:'background:var(--accent-dim);color:var(--accent);'}, 'baseline'));
      }
      const remove = el('button', {class:'compare-chip-remove', type:'button', title:'Remove'}, '\u00d7');
      remove.addEventListener('click', () => {
        state.models = state.models.filter(mid => mid !== id);
        if (state.baseline === id) state.baseline = state.models[0] || '';
        updateUrlAndRender();
      });
      chip.appendChild(remove);
      selectedWrap.appendChild(chip);
    }
  }

  function renderSummary(datasets) {
    clearNode(summary);
    const selectedCount = state.models.length;
    let missing = 0;
    let present = 0;
    for (const mid of state.models) {
      for (const ds of datasets) {
        if (completedScore(summaryData, mid, ds) == null) missing++;
        else present++;
      }
    }

    let bestModel = null;
    let bestAvg = null;
    for (const mid of state.models) {
      const avg = averageDisplayedScoreForModel(summaryData, mid, datasets, state.scale, state.models);
      if (avg != null && (bestAvg == null || avg > bestAvg)) {
        bestAvg = avg;
        bestModel = byId.get(mid);
      }
    }

    let bestGain = null;
    if (state.baseline) {
      for (const mid of state.models) {
        if (mid === state.baseline) continue;
        for (const ds of datasets) {
          const base = displayScoreFor(summaryData, state.baseline, ds, state.scale, state.models);
          const score = displayScoreFor(summaryData, mid, ds, state.scale, state.models);
          if (base == null || score == null) continue;
          const delta = score - base;
          if (!bestGain || delta > bestGain.delta) bestGain = {delta, model: byId.get(mid), dataset: ds};
        }
      }
    }

    const items = [
      [String(selectedCount), 'Selected models'],
      [String(datasets.length), state.commonOnly ? 'Common benchmarks' : 'Benchmarks shown'],
      [bestModel ? bestModel.display_name + ' ' + bestAvg.toFixed(3) : '\u2014', state.scale === 'normalized' ? 'Best normalized average' : 'Best raw average'],
      [bestGain ? signed(bestGain.delta) + ' ' + bestGain.model.display_name : (missing ? String(missing) : '0'), bestGain ? 'Biggest gain' : 'Missing cells'],
    ];
    for (const [value, label] of items) {
      const item = el('div', {class:'compare-stat'});
      item.appendChild(el('div', {class:'compare-stat-value'}, value));
      item.appendChild(el('div', {class:'compare-stat-label'}, label + (label === 'Missing cells' ? ' · ' + present + ' present' : '')));
      summary.appendChild(item);
    }
  }

  async function renderChart(datasets) {
    destroyCompareChart();
    clearNode(chartMount);
    barsBtn.classList.toggle('active', state.mode === 'bars');
    deltaBtn.classList.toggle('active', state.mode === 'delta');
    radarBtn.classList.toggle('active', state.mode === 'radar');
    curvesBtn.classList.toggle('active', state.mode === 'curves');
    normalizedBtn.classList.toggle('active', state.scale === 'normalized');
    rawBtn.classList.toggle('active', state.scale === 'raw');
    compareResetZoomBtn.style.display = compareModeHasZoom() ? 'inline-flex' : 'none';
    chartTitle.textContent = state.mode === 'delta'
      ? 'Difference vs baseline'
      : state.mode === 'radar'
        ? 'Capability profile'
        : state.mode === 'curves'
          ? 'Training curves'
          : 'Benchmark scores';
    chartNote.textContent = state.mode === 'delta'
      ? 'Positive values are above the selected baseline; negative values are below it.'
      : state.mode === 'radar'
        ? 'Radar shows category averages. Drag any rectangle or use the wheel to zoom; double click or Reset zoom to restore.'
        : state.mode === 'curves'
          ? 'Steps are most meaningful within the same training run; drag any rectangle or use the wheel to zoom, shift-drag to pan, double click or Reset zoom to restore.'
          : (state.scale === 'normalized'
              ? 'Normalized scores use native 0-1 ranges when possible, otherwise the current visible min/max.'
              : 'Raw scores show the original metric values.');

    if (!state.models.length || !datasets.length) {
      chartMount.appendChild(el('div', {class:'compare-empty'}, 'No comparable benchmark data.'));
      return;
    }
    if (state.mode === 'delta' && (!state.baseline || state.models.length < 2)) {
      chartMount.appendChild(el('div', {class:'compare-empty'}, 'Select at least two models for delta bars.'));
      return;
    }

    const canvas = document.createElement('canvas');
    chartMount.appendChild(canvas);
    const cc = chartColors();

    if (state.mode === 'delta') {
      const chartDatasets = state.models.filter(mid => mid !== state.baseline).map(mid => {
        const deltas = datasets.map(ds => {
          const base = displayScoreFor(summaryData, state.baseline, ds, state.scale, state.models);
          const score = displayScoreFor(summaryData, mid, ds, state.scale, state.models);
          return base == null || score == null ? null : score - base;
        });
        const rawDeltas = datasets.map(ds => {
          const base = completedScore(summaryData, state.baseline, ds);
          const score = completedScore(summaryData, mid, ds);
          return base == null || score == null ? null : score - base;
        });
        return {
          label: byId.get(mid)?.display_name || mid,
          _modelId: mid,
          _rawDeltas: rawDeltas,
          data: deltas,
          backgroundColor: deltas.map(v => v == null ? 'rgba(128,128,128,0.22)' : (v >= 0 ? cc.green + 'aa' : cc.red + 'aa')),
          borderColor: deltas.map(v => v == null ? 'rgba(128,128,128,0.4)' : (v >= 0 ? cc.green : cc.red)),
          borderWidth: 1,
        };
      });
      compareChart = new Chart(canvas, {
        type: 'bar',
        data: {labels: datasets, datasets: chartDatasets},
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: {mode:'index', intersect:false},
          scales: {
            x: {ticks:{color:cc.tick, maxRotation:45, minRotation:0, font:{size:11}}, grid:{display:false}},
            y: {ticks:{color:cc.tick, font:{size:11,family:'JetBrains Mono'}, callback:v => signed(v)}, grid:{color:cc.grid}, zeroLineColor:cc.grid},
          },
          plugins: {
            legend: {labels:{color:cc.legend, boxWidth:10, font:{size:11}}},
            tooltip: {
              backgroundColor:cc.tooltipBg, borderColor:cc.tooltipBorder, borderWidth:1, titleColor:cc.tooltipTitle, bodyColor:cc.tooltipBody,
              callbacks: {
                label(ctx) {
                  if (ctx.raw == null) return ctx.dataset.label + ': missing';
                  const rawDelta = ctx.dataset._rawDeltas?.[ctx.dataIndex];
                  const suffix = state.scale === 'normalized' && rawDelta != null ? ' · raw ' + signed(rawDelta) : '';
                  return ctx.dataset.label + ': ' + signed(ctx.raw) + suffix;
                },
              },
            },
          },
        },
      });
      compareChart.$compareDeltaValues = chartDatasets.map(d => d.data);
    } else if (state.mode === 'radar') {
      const axes = [];
      const categories = summaryData.categories || {};
      const catNames = Object.keys(categories).sort();
      if (catNames.length) {
        for (const cat of catNames) {
          const catDs = (categories[cat] || []).filter(ds => datasets.includes(ds));
          if (catDs.length) axes.push({label: cat, datasets: catDs});
        }
      }
      if (!axes.length) {
        for (const ds of datasets.slice(0, 12)) axes.push({label: ds, datasets: [ds]});
      }
      const chartDatasets = state.models.map(mid => {
        const color = modelColor(mid);
        return {
          label: byId.get(mid)?.display_name || mid,
          data: axes.map(axis => averageDisplayedScoreForModel(summaryData, mid, axis.datasets, state.scale, state.models)),
          borderColor: color,
          backgroundColor: color + '22',
          pointBackgroundColor: color,
          pointBorderColor: color,
          borderWidth: 2,
        };
      });
      const radarVals = chartDatasets.flatMap(ds => ds.data).filter(v => v != null);
      const radarMin = radarVals.length ? Math.max(0, Math.floor((Math.min(...radarVals) - 0.08) * 10) / 10) : 0;
      const radarMax = state.scale === 'normalized'
        ? 1
        : (radarVals.length ? Math.ceil((Math.max(...radarVals) + 0.08) * 10) / 10 : 1);
      if (radarMin > 0) chartNote.textContent += ' Axis starts at ' + radarMin.toFixed(1) + ' to reduce center crowding.';
      compareChart = new Chart(canvas, {
        type: 'radar',
        data: {labels: axes.map(a => a.label), datasets: chartDatasets},
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            r: {
              min: radarMin, max: radarMax,
              angleLines: {color: cc.grid},
              grid: {color: cc.grid},
              pointLabels: {color: cc.tick, font: {size: 11}},
              ticks: {color: cc.tick, backdropColor: 'transparent', font: {size: 10, family:'JetBrains Mono'}},
            },
          },
          plugins: {
            legend: {labels:{color:cc.legend, boxWidth:10, font:{size:11}}},
            tooltip: {
              backgroundColor:cc.tooltipBg, borderColor:cc.tooltipBorder, borderWidth:1, titleColor:cc.tooltipTitle, bodyColor:cc.tooltipBody,
              callbacks: { label(ctx) { return ctx.dataset.label + ': ' + (ctx.raw == null ? 'missing' : formatScore(ctx.raw)) + (state.scale === 'normalized' ? ' normalized' : ' raw'); } },
            },
            zoom: zoomPluginOptions(),
          },
        },
      });
    } else if (state.mode === 'curves') {
      const curveDs = state.benchmark || datasets[0];
      chartTitle.textContent = 'Training Curves · ' + curveDs;
      const compareModels = state.models.join(',');
      const cData = await api('/api/compare?models=' + encodeURIComponent(compareModels) + '&dataset=' + encodeURIComponent(curveDs));
      const allSteps = [];
      for (const mEntry of cData.models || []) {
        for (const p of mEntry.data_points || []) {
          if (p.training_step != null) allSteps.push(p.training_step);
        }
      }
      const xMin = allSteps.length ? Math.min(...allSteps) : 0;
      const xMax = allSteps.length ? Math.max(...allSteps) : 1;
      const chartDatasets = (cData.models || []).map(mEntry => {
        const color = modelColor(mEntry.model_id);
        if (mEntry.model_type === 'baseline' && mEntry.data_points.length > 0) {
          const val = mEntry.data_points[0].metric_value;
          return {
            label: mEntry.display_name,
            data: [{x:xMin, y:val}, {x:xMax, y:val}],
            borderColor: color,
            backgroundColor: color + '22',
            borderDash: [6, 4],
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0,
          };
        }
        return {
          label: mEntry.display_name,
          data: (mEntry.data_points || []).map(p => ({x: p.training_step ?? xMin, y: p.metric_value})),
          borderColor: color,
          backgroundColor: color + '22',
          borderWidth: 2,
          pointRadius: 3,
          pointHoverRadius: 5,
          tension: 0.25,
        };
      });
      compareChart = new Chart(canvas, {
        type: 'line',
        data: {datasets: chartDatasets},
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: {mode:'index', intersect:false},
          scales: {
            x: {type:'linear', ticks:{color:cc.tick, maxTicksLimit:6, font:{size:11,family:'JetBrains Mono'}}, grid:{color:cc.grid}},
            y: {min:0, max:1, ticks:{color:cc.tick, font:{size:11,family:'JetBrains Mono'}}, grid:{color:cc.grid}},
          },
          plugins: {
            legend: {labels:{color:cc.legend, boxWidth:10, font:{size:11}}},
            tooltip: {
              backgroundColor:cc.tooltipBg, borderColor:cc.tooltipBorder, borderWidth:1, titleColor:cc.tooltipTitle, bodyColor:cc.tooltipBody,
              callbacks: { label(ctx) { const r = ctx.raw; return ctx.dataset.label + ': ' + formatScore(r.y) + (r.x != null ? ' (step ' + r.x + ')' : ''); } },
            },
            zoom: zoomPluginOptions(),
          },
        },
      });
    } else {
      const chartDatasets = state.models.map(mid => {
        const color = modelColor(mid);
        const rawValues = datasets.map(ds => completedScore(summaryData, mid, ds));
        return {
          label: byId.get(mid)?.display_name || mid,
          _rawValues: rawValues,
          data: datasets.map(ds => displayScoreFor(summaryData, mid, ds, state.scale, state.models)),
          backgroundColor: color + 'aa',
          borderColor: color,
          borderWidth: 1,
          borderRadius: 3,
        };
      });
      const barVals = chartDatasets.flatMap(ds => ds.data).filter(v => v != null);
      const yMax = state.scale === 'normalized'
        ? 1
        : (barVals.length ? Math.ceil((Math.max(...barVals) + 0.05) * 10) / 10 : 1);
      compareChart = new Chart(canvas, {
        type: 'bar',
        data: {labels: datasets, datasets: chartDatasets},
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: {mode:'index', intersect:false},
          scales: {
            x: {ticks:{color:cc.tick, maxRotation:45, minRotation:0, font:{size:11}}, grid:{display:false}},
            y: {min:0, max:yMax, ticks:{color:cc.tick, font:{size:11,family:'JetBrains Mono'}}, grid:{color:cc.grid}},
          },
          plugins: {
            legend: {labels:{color:cc.legend, boxWidth:10, font:{size:11}}},
            tooltip: {
              backgroundColor:cc.tooltipBg, borderColor:cc.tooltipBorder, borderWidth:1, titleColor:cc.tooltipTitle, bodyColor:cc.tooltipBody,
              callbacks: {
                label(ctx) {
                  if (ctx.raw == null) return ctx.dataset.label + ': missing';
                  const raw = ctx.dataset._rawValues?.[ctx.dataIndex];
                  const suffix = state.scale === 'normalized' && raw != null ? ' · raw ' + formatScore(raw) : '';
                  return ctx.dataset.label + ': ' + formatScore(ctx.raw) + suffix;
                },
              },
            },
          },
        },
      });
    }
    if (compareModeHasZoom()) {
      canvas.addEventListener('dblclick', () => resetChartZoom(compareChart));
    }
    _charts.push(compareChart);
  }

  function renderTable(datasets) {
    clearNode(tablePanel);
    if (!state.models.length || !datasets.length) {
      tablePanel.appendChild(el('div', {class:'compare-empty'}, 'No comparable benchmark data.'));
      return;
    }
    const modelOrder = tableModelOrder();
    const table = document.createElement('table');
    table.className = 'compare-table';
    const thead = document.createElement('thead');
    const hrow = document.createElement('tr');
    hrow.appendChild(el('th', null, 'Benchmark'));
    hrow.appendChild(el('th', null, 'Coverage'));
    for (const mid of modelOrder) {
      const label = (byId.get(mid)?.display_name || mid) + (mid === state.baseline ? ' · Baseline' : '');
      hrow.appendChild(el('th', null, label));
    }
    thead.appendChild(hrow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    for (const ds of datasets) {
      const tr = document.createElement('tr');
      tr.appendChild(el('td', null, ds));
      const present = state.models.filter(mid => completedScore(summaryData, mid, ds) != null).length;
      tr.appendChild(el('td', {style:'color:var(--muted);font-family:var(--font-mono);'}, present + '/' + state.models.length));
      const base = state.baseline ? displayScoreFor(summaryData, state.baseline, ds, state.scale, state.models) : null;
      for (const mid of modelOrder) {
        const td = document.createElement('td');
        const raw = completedScore(summaryData, mid, ds);
        const v = displayScoreFor(summaryData, mid, ds, state.scale, state.models);
        if (v == null) {
          td.appendChild(el('span', {class:'compare-missing'}, '\u2014'));
        } else {
          const score = el('span', {class:'compare-score'}, formatScore(v));
          score.style.color = scoreColor(v);
          td.appendChild(score);
          if (state.scale === 'normalized' && raw != null) {
            td.appendChild(el('span', {class:'compare-raw-score'}, 'raw ' + formatScore(raw)));
          }
          if (mid !== state.baseline && base != null) {
            const delta = v - base;
            const deltaSpan = el('span', {class:'compare-delta ' + (delta >= 0 ? 'gap-positive' : 'gap-negative')}, signed(delta));
            td.appendChild(deltaSpan);
          }
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    tablePanel.appendChild(table);
  }

  async function renderAll() {
    byId = modelById(data);
    state.models = state.models.filter(id => byId.has(id)).slice(0, MAX_COMPARE_MODELS);
    if (!state.models.includes(state.baseline)) state.baseline = state.models[0] || '';
    populateAddSelect();
    populateBaselineSelect();
    populateBenchmarkSelect();
    commonToggle.checked = state.commonOnly;
    normalizedBtn.classList.toggle('active', state.scale === 'normalized');
    rawBtn.classList.toggle('active', state.scale === 'raw');
    suiteSelect.value = state.suite;
    setCompareUrl(state);
    await loadSummary();
    renderSelectedChips();
    const datasets = currentDatasets();
    const shared = sharedDatasetStats(data, state.models, state.benchmark);
    sharedCount.textContent = state.models.length > 1 ? shared.shared + '/' + shared.total + ' shared' : '';
    renderSummary(datasets);
    await renderChart(datasets);
    renderTable(datasets);
  }

  addSelect.addEventListener('change', async () => {
    const id = addSelect.value;
    if (!id || state.models.includes(id) || state.models.length >= MAX_COMPARE_MODELS) return;
    state.models.push(id);
    if (!state.baseline) state.baseline = id;
    await updateUrlAndRender();
  });

  baselineSelect.addEventListener('change', async () => {
    state.baseline = baselineSelect.value;
    await updateUrlAndRender();
  });

  suiteSelect.addEventListener('change', async () => {
    state.suite = suiteSelect.value;
    data = await loadHeatmap(state.suite);
    await updateUrlAndRender();
  });

  benchmarkSelect.addEventListener('change', async () => {
    state.benchmark = benchmarkSelect.value;
    await updateUrlAndRender();
  });

  commonToggle.addEventListener('change', async () => {
    state.commonOnly = commonToggle.checked;
    await updateUrlAndRender();
  });

  normalizedBtn.addEventListener('click', async () => {
    state.scale = 'normalized';
    await updateUrlAndRender();
  });

  rawBtn.addEventListener('click', async () => {
    state.scale = 'raw';
    await updateUrlAndRender();
  });

  compareResetZoomBtn.addEventListener('click', () => resetChartZoom(compareChart));

  barsBtn.addEventListener('click', async () => {
    state.mode = 'bars';
    await updateUrlAndRender();
  });

  deltaBtn.addEventListener('click', async () => {
    state.mode = 'delta';
    await updateUrlAndRender();
  });

  radarBtn.addEventListener('click', async () => {
    state.mode = 'radar';
    await updateUrlAndRender();
  });

  curvesBtn.addEventListener('click', async () => {
    state.mode = 'curves';
    await updateUrlAndRender();
  });

  savePresetBtn.addEventListener('click', () => {
    const name = prompt('Preset name:', state.models.map(id => byId.get(id)?.display_name || id).join(' vs '));
    if (!name) return;
    const presets = loadPresets().filter(p => p.name !== name);
    presets.unshift({
      name,
      state: {
        models: [...state.models],
        baseline: state.baseline,
        suite: state.suite,
        commonOnly: state.commonOnly,
        benchmark: state.benchmark,
        mode: state.mode,
        scale: state.scale,
      },
      saved_at: new Date().toISOString(),
    });
    savePresets(presets);
    populatePresetSelect();
  });

  presetSelect.addEventListener('change', async () => {
    const idx = Number(presetSelect.value);
    const preset = loadPresets()[idx];
    if (!preset || !preset.state) return;
    state.models = [...(preset.state.models || [])].slice(0, MAX_COMPARE_MODELS);
    state.baseline = preset.state.baseline || state.models[0] || '';
    state.suite = preset.state.suite || '';
    state.commonOnly = !!preset.state.commonOnly;
    state.benchmark = preset.state.benchmark || '';
    state.mode = preset.state.mode || 'bars';
    state.scale = preset.state.scale === 'raw' ? 'raw' : 'normalized';
    data = await loadHeatmap(state.suite);
    await updateUrlAndRender();
  });

  populatePresetSelect();
  setCompareUrl(state);
  await renderAll();
}

/* ===================================================================
   VIEW: LEADERBOARD (pivot heatmap)
   =================================================================== */
async function viewLeaderboard(app) {
  clearNode(app);
  const wrap = el('div', {class:'page-enter'});
  app.appendChild(wrap);
  wrap.appendChild(el('div', {class:'loading'}, 'Loading leaderboard...'));

  const [initialData, suitesData] = await Promise.all([api('/api/heatmap'), api('/api/suites')]);
  clearNode(wrap);

  // Section head with suite selector
  const sectionHead = el('div', {class:'section-head', style:'display:flex;align-items:center;'});
  sectionHead.appendChild(document.createTextNode('All Models \u00d7 All Benchmarks'));
  const lbSuiteSelect = document.createElement('select');
  lbSuiteSelect.style.cssText = 'margin-left:auto;';
  const lbAllOpt = document.createElement('option');
  lbAllOpt.value = '';
  lbAllOpt.textContent = 'All Benchmarks';
  lbSuiteSelect.appendChild(lbAllOpt);
  for (const s of suitesData.suites) {
    const opt = document.createElement('option');
    opt.value = s.suite_id;
    opt.textContent = s.display_name + ' (' + s.dataset_names.length + ')';
    lbSuiteSelect.appendChild(opt);
  }
  sectionHead.appendChild(lbSuiteSelect);
  wrap.appendChild(sectionHead);

  // Sort control
  const sortBar = el('div', {class:'compare-bar'});
  sortBar.appendChild(el('label', null, 'Sort by:'));
  const sortSelect = document.createElement('select');
  sortBar.appendChild(sortSelect);
  wrap.appendChild(sortBar);

  const tableContainer = el('div');
  wrap.appendChild(tableContainer);

  let currentData = initialData;
  const selectedCompare = new Set();

  const compareTray = el('div', {class:'compare-tray'});
  const trayCount = el('span', {class:'compare-tray-count'}, '0 selected');
  const trayMeta = el('span', {style:'color:var(--muted);font-size:12px;'}, 'Ready to compare');
  const trayCompareBtn = el('button', {class:'btn btn-small'}, 'Compare selected');
  const trayClearBtn = el('button', {class:'btn btn-secondary btn-small'}, 'Clear');
  compareTray.appendChild(trayCount);
  compareTray.appendChild(trayMeta);
  compareTray.appendChild(trayCompareBtn);
  compareTray.appendChild(trayClearBtn);
  wrap.appendChild(compareTray);

  function selectedIdsInCurrentOrder() {
    return (currentData.models || []).map(m => m.model_id).filter(id => selectedCompare.has(id));
  }

  function updateCompareTray() {
    const ids = selectedIdsInCurrentOrder();
    trayCount.textContent = ids.length + ' selected';
    trayMeta.textContent = ids.length >= MAX_COMPARE_MODELS ? 'Compare list full' : 'Up to ' + MAX_COMPARE_MODELS + ' models';
    compareTray.classList.toggle('visible', ids.length > 0);
  }

  trayCompareBtn.addEventListener('click', () => {
    const ids = selectedIdsInCurrentOrder();
    if (!ids.length) return;
    const state = {
      models: ids,
      baseline: ids[0],
      suite: lbSuiteSelect.value,
      commonOnly: false,
      benchmark: sortSelect.value,
      mode: 'bars',
    };
    location.hash = buildCompareHash(state);
  });

  trayClearBtn.addEventListener('click', () => {
    selectedCompare.clear();
    renderPivot(currentData, sortSelect.value);
    updateCompareTray();
  });

  function populateSortSelect(data) {
    clearNode(sortSelect);
    const defaultOpt = document.createElement('option');
    defaultOpt.value = '';
    defaultOpt.textContent = 'Default';
    sortSelect.appendChild(defaultOpt);
    // Build ordered datasets from categories
    const catOrder = Object.keys(data.categories || {}).sort();
    const orderedDatasets = [];
    for (const cat of catOrder) {
      orderedDatasets.push(...(data.categories[cat] || []).sort());
    }
    const categorized = new Set(orderedDatasets);
    for (const ds of data.datasets) {
      if (!categorized.has(ds)) orderedDatasets.push(ds);
    }
    for (const ds of orderedDatasets) {
      const opt = document.createElement('option');
      opt.value = ds;
      opt.textContent = ds;
      sortSelect.appendChild(opt);
    }
  }

  function renderPivot(data, sortDs) {
    clearNode(tableContainer);

    // Build ordered datasets from categories
    const catOrder = Object.keys(data.categories || {}).sort();
    const orderedDatasets = [];
    for (const cat of catOrder) {
      orderedDatasets.push(...(data.categories[cat] || []).sort());
    }
    const categorized = new Set(orderedDatasets);
    for (const ds of data.datasets) {
      if (!categorized.has(ds)) orderedDatasets.push(ds);
    }

    // Best per column
    const bestPerDs = {};
    for (const ds of orderedDatasets) {
      let best = -1;
      for (const m of data.models) {
        const entry = (data.matrix[m.model_id] || {})[ds];
        const v = entry && entry.score != null ? entry.score : null;
        if (v != null && v > best) best = v;
      }
      bestPerDs[ds] = best;
    }

    // Sort models
    let sorted = [...data.models];
    if (sortDs) {
      sorted.sort((a, b) => {
        const entryA = (data.matrix[a.model_id] || {})[sortDs];
        const entryB = (data.matrix[b.model_id] || {})[sortDs];
        const va = entryA && entryA.score != null ? entryA.score : -1;
        const vb = entryB && entryB.score != null ? entryB.score : -1;
        return vb - va;
      });
    }
    const visibleIds = sorted.map(m => m.model_id);

    const pivotWrap = el('div', {class:'pivot-wrap'});
    const table = document.createElement('table');
    table.className = 'pivot';

    const thead = document.createElement('thead');

    // Category sub-header row
    if (catOrder.length > 0) {
      const catRow = document.createElement('tr');
      catRow.className = 'type-separator';
      const catModelTd = document.createElement('td');
      catModelTd.colSpan = 3;
      catRow.appendChild(catModelTd);
      for (const cat of catOrder) {
        const catTd = document.createElement('td');
        catTd.colSpan = (data.categories[cat] || []).length;
        catTd.textContent = cat;
        catTd.style.cssText = 'text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);';
        catRow.appendChild(catTd);
      }
      if (data.datasets.filter(ds => !categorized.has(ds)).length > 0) {
        const uncatTd = document.createElement('td');
        uncatTd.colSpan = data.datasets.filter(ds => !categorized.has(ds)).length;
        catRow.appendChild(uncatTd);
      }
      thead.appendChild(catRow);
    }

    const hRow = document.createElement('tr');
    const selectAllTh = el('th', {class:'compare-select-cell'});
    const selectAll = document.createElement('input');
    selectAll.type = 'checkbox';
    selectAll.className = 'model-compare-check';
    const visibleSelected = visibleIds.filter(id => selectedCompare.has(id));
    selectAll.checked = visibleIds.length > 0 && visibleSelected.length === visibleIds.length;
    selectAll.indeterminate = visibleSelected.length > 0 && visibleSelected.length < visibleIds.length;
    selectAll.addEventListener('change', () => {
      if (selectAll.checked) {
        for (const id of visibleIds) {
          if (selectedCompare.size >= MAX_COMPARE_MODELS) break;
          selectedCompare.add(id);
        }
      } else {
        for (const id of visibleIds) selectedCompare.delete(id);
      }
      renderPivot(data, sortDs);
      updateCompareTray();
    });
    selectAllTh.appendChild(selectAll);
    hRow.appendChild(selectAllTh);
    hRow.appendChild(el('th', {style:'text-align:left'}, 'Model'));
    hRow.appendChild(el('th', null, 'Type'));
    for (const ds of orderedDatasets) {
      const th = el('th', null, ds);
      if (ds === sortDs) th.style.color = 'var(--accent)';
      hRow.appendChild(th);
    }
    thead.appendChild(hRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    for (const m of sorted) {
      const tr = document.createElement('tr');
      if (selectedCompare.has(m.model_id)) tr.classList.add('compare-selected-row');

      const selectTd = el('td', {class:'compare-select-cell'});
      const check = document.createElement('input');
      check.type = 'checkbox';
      check.className = 'model-compare-check';
      check.checked = selectedCompare.has(m.model_id);
      check.disabled = !check.checked && selectedCompare.size >= MAX_COMPARE_MODELS;
      check.addEventListener('click', e => e.stopPropagation());
      check.addEventListener('change', () => {
        if (check.checked) selectedCompare.add(m.model_id);
        else selectedCompare.delete(m.model_id);
        renderPivot(data, sortDs);
        updateCompareTray();
      });
      selectTd.appendChild(check);
      tr.appendChild(selectTd);

      const nameTd = document.createElement('td');
      nameTd.className = 'model-col';
      const link = el('a', {href:'#model/' + encodeURIComponent(m.model_id), style:'color:var(--text-bright);text-decoration:none'}, m.display_name);
      link.addEventListener('mouseover', () => link.style.color = 'var(--accent)');
      link.addEventListener('mouseout', () => link.style.color = 'var(--text-bright)');
      nameTd.appendChild(link);
      tr.appendChild(nameTd);

      const typeTd = document.createElement('td');
      typeTd.appendChild(makeBadge(m.model_type));
      tr.appendChild(typeTd);

      const scores = data.matrix[m.model_id] || {};
      for (const ds of orderedDatasets) {
        const td = document.createElement('td');
        const entry = scores[ds] || null;
        renderScoreCell(td, entry, bestPerDs[ds], ds);
        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    }

    table.appendChild(tbody);
    pivotWrap.appendChild(table);
    tableContainer.appendChild(pivotWrap);
    updateCompareTray();
  }

  populateSortSelect(initialData);
  renderPivot(initialData, '');
  sortSelect.addEventListener('change', () => renderPivot(currentData, sortSelect.value));

  lbSuiteSelect.addEventListener('change', async () => {
    const suiteId = lbSuiteSelect.value;
    const url = suiteId ? '/api/heatmap?suite_id=' + encodeURIComponent(suiteId) : '/api/heatmap';
    currentData = await api(url);
    populateSortSelect(currentData);
    renderPivot(currentData, '');
  });
}

/* ===================================================================
   VIEW: ACTIVITY FEED
   =================================================================== */
async function viewActivity(app) {
  clearNode(app);
  const wrap = el('div', {class:'page-enter'});
  app.appendChild(wrap);

  wrap.appendChild(el('h2', {class:'section-title'}, 'Activity Feed'));

  // Filter bar
  const filterBar = el('div', {class:'filter-bar-activity'});
  const typeSelect = el('select');
  typeSelect.innerHTML = '<option value="">All events</option><option value="regression">Regressions</option><option value="improvement">Improvements</option><option value="eval_completed">Eval completed</option>';
  filterBar.appendChild(typeSelect);

  const sevSelect = el('select');
  sevSelect.innerHTML = '<option value="">All severity</option><option value="critical">Critical</option><option value="warning">Warning</option><option value="info">Info</option>';
  filterBar.appendChild(sevSelect);
  wrap.appendChild(filterBar);

  // Alerts summary
  const alertSummary = el('div', {style:'margin-bottom: 16px;'});
  wrap.appendChild(alertSummary);

  // Activity list
  const feed = el('div', {class:'activity-feed'});
  wrap.appendChild(feed);

  async function loadActivity() {
    // Load alerts summary
    try {
      const alertData = await api('/api/alerts?acknowledged=false&limit=200');
      const alerts = alertData.alerts || [];
      const critCount = alerts.filter(a => a.severity === 'critical').length;
      const warnCount = alerts.filter(a => a.severity === 'warning').length;
      if (critCount || warnCount) {
        alertSummary.innerHTML = '';
        const box = el('div', {style:'padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; display: flex; gap: 12px; align-items: center;'});
        box.innerHTML = '<span style="font-size:13px; color: var(--text);">Unacknowledged alerts:</span>';
        if (critCount) box.innerHTML += '<span class="alert-badge critical">' + critCount + ' critical</span>';
        if (warnCount) box.innerHTML += '<span class="alert-badge warning">' + warnCount + ' warning</span>';
        alertSummary.appendChild(box);
      }
    } catch(e) {}

    // Load events
    const events = await api('/api/activity?limit=100');
    clearNode(feed);
    const items = events.events || [];
    if (!items.length) {
      feed.appendChild(el('div', {class:'empty-state'}, 'No activity yet.'));
      return;
    }
    for (const evt of items) {
      if (typeSelect.value && evt.event_type !== typeSelect.value) continue;
      const iconClass = evt.event_type === 'regression' ? 'regression' : evt.event_type === 'improvement' ? 'improvement' : 'eval_completed';
      const iconChar = evt.event_type === 'regression' ? '\u2193' : evt.event_type === 'improvement' ? '\u2191' : '\u2022';
      const item = el('div', {class:'activity-item'});
      const icon = el('div', {class:'activity-icon ' + iconClass});
      icon.textContent = iconChar;
      item.appendChild(icon);
      const body = el('div', {class:'activity-body'});
      const summaryEl = el('div', {class:'activity-summary'});
      summaryEl.textContent = evt.summary || '';
      body.appendChild(summaryEl);
      const meta = el('div', {class:'activity-meta'});
      const modelLink = evt.model_id ? '<a href="#model/' + encodeURIComponent(evt.model_id) + '">' + evt.model_id + '</a>' : '';
      meta.innerHTML = [modelLink, evt.dataset_name, evt.event_type].filter(Boolean).join(' \u00B7 ');
      body.appendChild(meta);
      item.appendChild(body);
      // Delta badge
      if (evt.detail && evt.detail.delta != null) {
        const delta = evt.detail.delta;
        const cls = delta > 0 ? 'diff-positive' : delta < 0 ? 'diff-negative' : 'diff-neutral';
        const badge = el('span', {class: cls, style:'font-family: var(--font-mono); font-size: 12px; white-space: nowrap;'});
        badge.textContent = (delta > 0 ? '+' : '') + delta.toFixed(4);
        item.appendChild(badge);
      }
      feed.appendChild(item);
    }
  }

  typeSelect.addEventListener('change', loadActivity);
  sevSelect.addEventListener('change', loadActivity);
  await loadActivity();
}

/* ===================================================================
   VIEW: CHECKPOINT DIFF
   =================================================================== */
async function viewDiff(app, cpA, cpB) {
  clearNode(app);
  const wrap = el('div', {class:'page-enter'});
  app.appendChild(wrap);

  const data = await api('/api/diff?checkpoint_a=' + encodeURIComponent(cpA) + '&checkpoint_b=' + encodeURIComponent(cpB));

  const stepA = data.checkpoint_a.training_step;
  const stepB = data.checkpoint_b.training_step;
  wrap.appendChild(el('h2', {class:'section-title'}, 'Checkpoint Diff'));
  const subtitle = el('div', {class:'model-subtitle', style:'margin-bottom:16px;'});
  subtitle.textContent = (stepA != null ? 'Step ' + stepA : cpA) + '  vs  ' + (stepB != null ? 'Step ' + stepB : cpB);
  wrap.appendChild(subtitle);

  // Summary chips
  const s = data.summary || {};
  const chips = el('div', {style:'display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;'});
  chips.innerHTML =
    '<span class="metric-chip" style="border-color:var(--green);">' + (s.improved||0) + ' improved</span>' +
    '<span class="metric-chip" style="border-color:var(--red);">' + (s.regressed||0) + ' regressed</span>' +
    '<span class="metric-chip" style="border-color:var(--muted);">' + (s.unchanged||0) + ' unchanged</span>';
  wrap.appendChild(chips);

  // Table
  const table = document.createElement('table');
  table.className = 'diff-table';
  let thead = '<thead><tr><th>Dataset</th><th>Score A (Step ' + (stepA||'?') + ')</th><th>Score B (Step ' + (stepB||'?') + ')</th><th>Delta</th><th>Significance</th></tr></thead>';
  let tbody = '<tbody>';
  for (const d of (data.datasets || [])) {
    const cls = d.delta > 0 ? 'diff-positive' : d.delta < 0 ? 'diff-negative' : 'diff-neutral';
    const deltaStr = d.delta != null ? (d.delta > 0 ? '+' : '') + d.delta.toFixed(4) : '\u2014';
    const sigLabel = d.significance === 'likely_real' ? '\u25CF real' : d.significance === 'likely_noise' ? '~ noise' : d.significance === 'uncertain' ? '? uncertain' : '\u2014';
    tbody += '<tr><td>' + d.dataset_name + '</td><td>' + (d.score_a != null ? d.score_a.toFixed(4) : '\u2014') + '</td><td>' + (d.score_b != null ? d.score_b.toFixed(4) : '\u2014') + '</td><td class="' + cls + '">' + deltaStr + '</td><td>' + sigLabel + '</td></tr>';
  }
  tbody += '</tbody>';
  table.innerHTML = thead + tbody;
  wrap.appendChild(table);
}

/* ===================================================================
   PROMOTION STATUS HELPER
   =================================================================== */
async function renderPromotionBadge(container, modelId) {
  try {
    const data = await api('/api/models/' + encodeURIComponent(modelId) + '/promotion-status');
    const badge = el('span', {class: 'promotion-badge ' + data.overall});
    if (data.overall === 'ready') badge.textContent = '\u2713 Promotion Ready';
    else if (data.overall === 'blocked') badge.textContent = '\u2717 Blocked';
    else if (data.overall === 'no_rules') badge.textContent = 'No promotion rules';
    else badge.textContent = 'No data';
    container.appendChild(badge);
    // Show rule details on hover
    if (data.rules && data.rules.length) {
      const details = el('div', {style:'margin-top: 8px; font-size: 12px; color: var(--muted);'});
      for (const r of data.rules) {
        const line = el('div', {style:'margin-bottom: 4px;'});
        const icon = r.passed ? '\u2713' : '\u2717';
        const color = r.passed ? 'var(--green)' : 'var(--red)';
        line.innerHTML = '<span style="color:' + color + ';">' + icon + '</span> ' + r.rule_name;
        if (r.failures && r.failures.length) {
          line.innerHTML += '<div style="margin-left:16px; color:var(--red); font-size:11px;">' + r.failures.join('<br>') + '</div>';
        }
        details.appendChild(line);
      }
      container.appendChild(details);
    }
  } catch(e) {}
}
